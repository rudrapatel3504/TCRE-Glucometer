# =========================================================================
# NGINX CONFIGURATION FOR TCRE GLUCOMETER SYSTEM DEPLOYMENT
# =========================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
                    
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    
    # Enable Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting configuration
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream Frontend Configuration (Next.js Node server)
    upstream frontend_server {
        server 127.0.0.1:3000;
    }

    # Upstream Backend Configuration (Express API server)
    upstream backend_server {
        server 127.0.0.1:3001;
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name tcre-glucometer.example.com; # Replace with clinical domain
        return 301 https://$host$request_uri;
    }

    # Secure HTTPS Server
    server {
        listen 443 ssl http2;
        server_name tcre-glucometer.example.com; # Replace with clinical domain

        # SSL Certificates (managed via Let's Encrypt / Certbot)
        ssl_certificate /etc/letsencrypt/live/tcre-glucometer.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tcre-glucometer.example.com/privkey.pem;
        
        # Secure SSL Protocols and Ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Static Assets Caching for Frontend
        location /_next/static/ {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            access_log off;
        }

        # Root and Frontend routing
        location / {
            proxy_pass http://frontend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend REST API routing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS Preflight and headers
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin "https://tcre-glucometer.example.com" always;
        }
    }
}
