version: '3.8'

services:
  # 1. Relational Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: tcre_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: tcre_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema:/docker-entrypoint-initdb.d
    networks:
      - tcre_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcre_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend Express API Server
  backend:
    build:
      context: ../../
      dockerfile: config/docker/backend.Dockerfile
    container_name: tcre_backend_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      LOCAL_DB_DIR: /app/database/data
      DATABASE_URL: postgresql://postgres:postgres_password@db:5432/tcre_db?schema=public
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ../../database/data:/app/database/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tcre_network

  # 3. Frontend Next.js Dashboard Client
  frontend:
    build:
      context: ../../
      dockerfile: config/docker/frontend.Dockerfile
    container_name: tcre_frontend_client
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - tcre_network

volumes:
  postgres_data:

networks:
  tcre_network:
    driver: bridge
